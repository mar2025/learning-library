<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="INDEX, FOLLOW">

    <title>{{page.title}}</title>
    <meta name="description" content="{{page.description}}">
    <meta name="keywords" content="{{page.tags}}">

    <!-- Preload critical resources -->
    <link rel="preload" href="{{ '/ziplabs/common/css/critical.css?v=' | append: site.github.build_revision | relative_url }}" as="style">
    <link rel="preload" href="{{ '/ziplabs/common/js/bundle.min.js?v=' | append: site.github.build_revision | relative_url }}" as="script">
    
    <!-- Critical CSS inlined -->
    <style>
        /* Critical above-the-fold styles */
        body{font-family:"Helvetica Neue","Segoe UI","Roboto",sans-serif;color:#4f4f4f;font-size:15px;line-height:1.5em;margin:0;padding:0}
        header{width:100%;min-height:55px;position:absolute;top:0;left:0;background-color:#f7f7f7;border-bottom:1px solid #A9BBD0;z-index:50}
        .oracle-logo{float:left;margin:10px}
        #content{position:relative;margin-top:55px;overflow-x:hidden}
        h1{font-size:36px;line-height:1.1em;color:#D24541;margin:15px 0!important}
        h2{font-size:30px;line-height:1.2em;color:#727272;margin:15px 0;font-weight:300;background-color:#E4F0FA;color:#145C93;margin-left:55px;padding:5px 0 5px 5px}
        .w1024{max-width:1024px;margin:0 auto}
        @media (min-width:768px){#bookContainer{margin-left:220px}#sidebar{display:block;width:220px}}
    </style>

    <!-- Non-critical CSS loaded asynchronously -->
    <link rel="preload" href="{{ '/ziplabs/common/css/bundle.min.css?v=' | append: site.github.build_revision | relative_url }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="{{ '/ziplabs/common/css/bundle.min.css?v=' | append: site.github.build_revision | relative_url }}"></noscript>

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="//cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="//cdn.rawgit.com">
    <link rel="dns-prefetch" href="//www.oracleimg.com">

    <!--[if lt IE 9]>
    <script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
</head>

<body>
    <header>
        <div class="w1024" style="min-height:55px; display:block;">
            <a href="http://docs.oracle.com" class="oracle-logo">
                <img src="../common/img/oracle_doc_logo.webp" alt="Oracle Documentation" 
                     width="236" height="22" loading="eager"
                     style="max-width: none;">
            </a>
        </div>
    </header>

    <div id="content">
        <h1>
            <img src="../common/img/obe_tag.webp" alt="Oracle by Example branding" 
                 width="100" height="50" loading="eager" />
            <span id="mainTitle"></span>
        </h1>
        <div class="w1024" style="position:relative; margin-top:40px;">
            <div class="navbackwide border-right"></div>
            <div id="shownav" title="Show Navigation" aria-label="Show Navigation"></div>
            <div id="hidenavw" title="Hide Navigation" aria-label="Hide Navigation"></div>
            <div id="sidebar">
                <div class="left-nav-tut">
                    <div id="navbar" class="left-nav-w">
                        <div id="toc" class="tocify"></div>
                    </div>
                </div>
            </div>
            <div id="bookContainer">
                <article>
                    <div data-spy="scroll" data-target=".left-nav-w"></div>
                    {{ content }}
                </article>
            </div>
            <br class="clearfloat">
        </div>
    </div>

    <div class="footer-container">
        <div style="max-width: 994px; padding:10px 0 0 17px;">
            <footer class="footer-list">
                <ul>
                    <li><a href="http://www.oracle.com/corporate/index.html" target="_blank" rel="noopener">About Oracle</a></li>
                    <li><a href="http://www.oracle.com/us/corporate/contact/index.html" target="_blank" rel="noopener">Contact Us</a></li>
                    <li><a href="http://www.oracle.com/us/legal/index.html" target="_blank" rel="noopener">Legal Notices</a></li>
                    <li><a href="http://www.oracle.com/us/legal/terms/index.html" target="_blank" rel="noopener">Terms of Use</a></li>
                    <li><a href="http://www.oracle.com/us/legal/privacy/index.html" target="_blank" rel="noopener">Your Privacy Rights</a></li>
                    <li><a href="http://www.oracle.com/pls/topic/lookup?ctx=cpyr&id=en" rel="noopener">Copyright © 2017, Oracle and/or its affiliates. All rights reserved.</a></li>
                </ul>
            </footer>
        </div>
    </div>

    <!-- Optimized JavaScript bundle loaded at end of body -->
    <script>
        // Inline critical JavaScript for immediate functionality
        window.s_prefix = "OBE";
        if (typeof document.title !== "undefined") {
            window.s_pageName = window.s_prefix + ":" + document.title;
        }
    </script>
    
    <!-- Load main bundle asynchronously -->
    <script src="{{ '/ziplabs/common/js/bundle.min.js?v=' | append: site.github.build_revision | relative_url }}" defer></script>
    
    <!-- Load analytics asynchronously -->
    <script>
        (function() {
            var script = document.createElement('script');
            script.src = 'https://www.oracleimg.com/us/assets/metrics/ora_docs.js';
            script.async = true;
            document.head.appendChild(script);
        })();
    </script>
</body>
</html>
